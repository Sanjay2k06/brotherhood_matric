version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: brotherhood_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brotherhood_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d brotherhood_cms" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: brotherhood_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/backend
      - uploads_volume:/backend/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/brotherhood_cms
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_volume:
